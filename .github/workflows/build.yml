name: Auto Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Auto Detect and Extract ZIP
      run: |
        echo "Mencari file ZIP di repositori..."
        ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

        if [ -z "$ZIP_FILE" ]; then
          echo "ERROR: Tidak ada file .zip yang ditemukan di root repositori!"
          exit 1
        fi

        echo "Ditemukan file: $ZIP_FILE"
        mkdir -p temp_extract
        unzip -q "$ZIP_FILE" -d temp_extract

        if [ -d "temp_extract/app" ]; then
          mv temp_extract/* .
        else
          INNER_DIR=$(find temp_extract -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -n "$INNER_DIR" ]; then
            mv "$INNER_DIR"/* .
          else
            mv temp_extract/* .
          fi
        fi

        rm -rf temp_extract
        echo "Ekstrak selesai."
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          echo "gradlew ditemukan dan diberi izin eksekusi."
        else
          echo "PERINGATAN: File 'gradlew' TIDAK DITEMUKAN di dalam zip!"
        fi

    # --- BAGIAN YANG DIUBAH: Naikkan ke 8.13 ---
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.13
    # -------------------------------------------

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "File gradlew tidak ada, mencoba perintah 'gradle' langsung..."
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
        if-no-files-found: warn
