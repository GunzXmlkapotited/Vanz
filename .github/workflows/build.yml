name: Auto Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Auto Detect and Extract ZIP
      run: |
        echo "Mencari file ZIP di repositori..."
        # Mencari file zip di root, ambil yang pertama ditemukan
        ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

        if [ -z "$ZIP_FILE" ]; then
          echo "ERROR: Tidak ada file .zip yang ditemukan di root repositori!"
          exit 1
        fi

        echo "Ditemukan file: $ZIP_FILE"
        echo "Mengekstrak ke folder sementara..."
        mkdir -p temp_extract
        unzip -q "$ZIP_FILE" -d temp_extract

        # Cek apakah hasil ekstrak langsung berisi folder 'app' atau dibungkus 1 folder
        if [ -d "temp_extract/app" ]; then
          echo "Struktur terdeteksi langsung di root zip."
          mv temp_extract/* .
        else
          # Jika dibungkus 1 folder (misal: apk_no_strings_display/)
          INNER_DIR=$(find temp_extract -maxdepth 1 -mindepth 1 -type d | head -n 1)
          if [ -n "$INNER_DIR" ]; then
            echo "Struktur terdeteksi di dalam folder: $INNER_DIR"
            mv "$INNER_DIR"/* .
          else
            mv temp_extract/* .
          fi
        fi

        rm -rf temp_extract
        echo "Ekstrak selesai. Isi folder saat ini:"
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          echo "gradlew ditemukan dan diberi izin eksekusi."
        else
          echo "PERINGATAN: File 'gradlew' TIDAK DITEMUKAN!"
          echo "Pastikan file gradlew ada di dalam zip agar build bisa berjalan."
        fi

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "Mencoba menggunakan gradle sistem..."
          gradle assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # Path ini mencari APK di mana saja di dalam folder hasil build
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/release/*.apk
        if-no-files-found: warn
